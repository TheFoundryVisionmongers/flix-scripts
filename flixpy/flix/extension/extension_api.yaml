                  $ref: '#/components/schemas/PingEvent'
              required:
                - type
                - data
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - STATUS
                data:
                  $ref: '#/components/schemas/StatusResponse'
              required:
                - type
                - data
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - PROJECT
                data:
                  $ref: '#/components/schemas/ProjectDetailsDto'
              required:
                - type
                - data
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - ACTION
                data:
                  $ref: '#/components/schemas/ActionEvent'
              required:
                - type
                - data
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - OPEN
                data:
                  oneOf:
                    - $ref: '#/components/schemas/OpenFileEvent'
                    - $ref: '#/components/schemas/OpenSourceFileEvent'
              required:
                - type
                - data
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - VERSION
                data:
                  $ref: '#/components/schemas/VersionEvent'
              required:
                - type
                - data
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - PREFERENCES
                data:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: integer
                      - type: boolean
              required:
                - type
                - data
      required:
        - data
