    PanelRequestItem:
      type: object
      properties:
        panelId:
          type: integer
          description: The ID of the panel that should be updated.
          example: 15
        duration:
          type: integer
          description: Duration is the number of frames this instance of [PanelRevision] has, within this [Shot].
        trimInFrame:
          type: integer
          description: TrimInFrame is the trim in of this panel revision in a given sequence revision if this is an animated panel.
        trimOutFrame:
          type: integer
          description: TrimOutFrame is the trim out of this panel revision in a given sequence revision if this is an animated panel.
        path:
          type: string
          description: The file path to upload.
          example: /path/to/file/1.psd
        keyframes:
          description: The camera move keyframes on this panel revisions.
          type: array
          items:
            $ref: '#/components/schemas/KeyframeRequest'
        originSbp:
          type: object
          description: |-
            Contains information about panel revisions imported from Storyboard Pro.
            This is for internal use by the Storyboard Pro extension and might be removed in the future without notice.
        sourceMedia:
          type: string
          description: This is used to upload a MOV file that will be used as the source media for the panel preview.
        dialogue:
          type: string
          description: This is dialogue text that will be associated with the panel.
        layerTransform:
          type: boolean
          description: This indicates whether panel has layer transform.
        shotName:
          type: string
          description: |-
            The name of the shot this panel belongs to.
            When specified, a shot with the given name will be created and this panel will be added to it.
            If the name already exists within the sequence, the request will be rejected with a 400 Bad Request response.
            If not provided, the panel will be added to an existing shot based on the target insert index.
          example: Shot 001
      required:
        - path
    PanelRequestSourceFile:
      type: object
      properties:
        path:
          type: string
          description: The path to the source file.
          example: /path/to/source/file.psd
        previewMode:
          type: string
          description: |-
            The mode to use to generate the source file preview.
            @default 'first_panel'
          example: source_file
          enum:
            - first_panel
            - source_file
        sourceFileType:
          type: string
          description: The extension type that the source file is coming from.
          example: Sketch
          enum:
            - Sketch
            - Editorial
            - 3D
            - Standalone
            - Script
      required:
        - path
        - previewMode
        - sourceFileType
    FullPanelRequest:
      type: object
      properties:
        startIndex:
          type: integer
          description: (Optional) The index from which to insert or update panels. Defaults to currently selected panel.
          example: 3
        panels:
          description: The file paths to upload and the IDs of the panels they should update.
          type: array
          items:
            $ref: '#/components/schemas/PanelRequestItem'
        sourceFile:
          description: (Optional) The source file to upload.
          allOf:
            - $ref: '#/components/schemas/PanelRequestSourceFile'
        origin:
          type: string
          description: The origin of the incoming panel artwork.
          example: Photoshop
        skipPanelReuse:
          type: boolean
          description: Whether panel reuse checks should be skipped. Will always skip if true, and always do reuse checks if false.
          example: true
      required:
        - panels
        - origin
    BulkPanelAnnotateRequest:
      type: object
      properties:
        startIndex:
          type: integer
          description: (Optional) The index from which to annotate panels. Defaults to currently selected panel.
          example: 3
        paths:
          description: The file paths to be uploaded as panel annotations.
          example:
            - /path/to/file/1.psd
            - /path/to/file/2.psd
          type: array
          items:
            type: string
        origin:
          type: string
          description: The origin of the incoming annotation.
          example: Photoshop
      required:
        - startIndex
        - paths
        - origin
    FullPanelAnnotateRequest:
      type: object
      properties:
        startIndex:
          type: integer
          description: (Optional) The index from which to annotate panels. Defaults to currently selected panel.
          example: 3
        panels:
          description: The file paths to upload and the panel IDs that they should annotate.
          type: array
          items:
            $ref: '#/components/schemas/PanelRequestItem'
        origin:
          type: string
          description: The origin of the incoming annotation.
          example: Photoshop
      required:
        - startIndex
        - panels
        - origin
    BulkPanelRequest:
      type: object
      properties:
        startIndex:
          type: integer
          description: (Optional) The index from which to insert or update panels. Defaults to currently selected panel.
          example: 3
        paths:
          description: The file paths to upload as new panel artwork.
          example:
            - /path/to/file/1.psd
            - /path/to/file/2.psd
          type: array
          items:
            type: string
        sourceFile:
          description: (Optional) The source file to upload.
          allOf:
            - $ref: '#/components/schemas/PanelRequestSourceFile'
        origin:
          type: string
          description: The origin of the incoming panel artwork.
          example: Photoshop
        skipPanelReuse:
          type: boolean
          description: Whether panel reuse checks should be skipped. Will always skip if true, and always do reuse checks if false.
          example: true
      required:
        - paths
        - origin
    PanelRequestResponse:
