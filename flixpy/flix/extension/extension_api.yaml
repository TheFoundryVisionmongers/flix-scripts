    DownloadRequest:
      type: object
      properties:
        assetId:
          type: integer
          description: The identifier of an asset in Flix. For example, the asset specified in the `OPEN` event.
        targetFolder:
          type: string
          description: The folder that the requested asset should be downloaded into.
        assetType:
          type: string
          description: The type of media object to download for the specified asset.
          enum:
            - aaf
            - annotation
            - artwork
            - audio
            - contactsheet
            - dialogue
            - dnxhd
            - extension
            - fullres
            - import_log
            - import_log_bundle
            - logo
            - xml
            - publish
            - publish_fullsized
            - sboard
            - scaled
            - show-thumbnail
            - source_media
            - source_file
            - state_yaml
            - thumbnail
            - watermark
            - wav
            - unknown
      required:
        - assetId
        - targetFolder
        - assetType
    DownloadResponse:
      type: object
