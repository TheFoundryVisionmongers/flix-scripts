[project]
name = "flix-sdk"
version = "3.0.1"
description = "Python SDK and command-line utilities for Flix"
authors = []
requires-python = ">=3.11,<4.0"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "aiohttp>=3.14.5,<4.0.0",
    "anyio>=4.16.0,<5.0.0",
    "appdirs>=1.4.4,<2.0.0",
    "asyncclick>=8.4.2.1,<9.0.0.0",
    "attrs>=26.1.0,<27.0.0",
    "cryptography>=50.0.2,<51.0.0",
    "grpcio>=1.85.3,<2.0.0",
    "httpx2>=2.16.2,<3.0.0",
    "protobuf>=7.36.2,<8.0.0",
    "python-dateutil>=4.0.0,<5.0.0",
    "python-socketio>=5.18.1,<6.0.0",
    "typing-extensions>=4.16.0,<5.0.0",
]

[project.urls]
Homepage = "https://www.foundry.com/products/flix"
Repository = "https://github.com/TheFoundryVisionmongers/flix-scripts/tree/master/flixpy"

[project.scripts]
flix = "flix.cli.main:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.3,<2.0.0",
    "mypy>=2.4.1,<3.0.0",
    "mypy-protobuf>=5.1.0,<6.0.0",
    "openapi-python-client>=0.30.0,<0.31.0",
    "pre-commit>=4.7.0,<5.0.0",
    "pyright>=1.1.414,<2.0.0",
    "ruff>=0.17.6,<0.18.0",
    "types-appdirs>=1.4.3.5,<2.0.0.0",
    "types-grpcio>=1.85.0.20261122,<2.0.0.0",
    "types-protobuf>=7.35.1.20261122,<8.0.0.0",
    "types-python-dateutil>=2.9.0.20261122,<3.0.0.0",
]
examples = [
    "shotgun-api3>=3.10.5,<4.0.0",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["flix"]
module-root = ""

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["flix", "examples"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/stubs"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["flix", "examples", "stubs"]
ignore = ["**/*_pb2*", "**/extension/extension_api/**"]
stubPath = "./stubs"

[tool.ruff]
include = ["pyproject.toml", "flix/**/*.py", "examples/**/*.py", "stubs/**/*.pyi"]
extend-exclude = ["*_pb2*", "flix/extension/extension_api/**"]
target-version = "py311"
line-length = 100

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 50

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # conflict with ruff format
    "ISC001", "COM812",
    # lots of arguments is ok as long as they're keyword arguments
    "PLR0913",
    # very silly rule, why would you want less informative exceptions
    "TRY003",
    # these exception rules are bad
    "EM",
    # relative imports are fine and good actually
    "TID252",
    # removing else would change the semantics if the return was removed
    "RET505", "RET506", "RET507", "RET508",
    # str.format is more readable than f-strings sometimes
    "UP032",
    # breaking change
    "A005",
    # TODO re-enable these ASAP
    "FBT001", "FBT002", "ANN401",
    "D101", "D102", "D103", "D105", "D106", "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"
