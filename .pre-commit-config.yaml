files: ^flixpy/
repos:
- repo: local
  hooks:
#    - id: ruff-check
#      name: ruff check
#      entry: uv --directory flixpy run ruff check
#      language: python
#      types_or: [python, pyi]
#      pass_filenames: false

    - id: ruff-format
      name: ruff format
      entry: uv --directory flixpy run ruff format
      language: python
      types_or: [python, pyi]
      pass_filenames: false

    - id: mypy
      name: mypy
      entry: uv --directory flixpy run mypy
      language: python
      types_or: [python, pyi]
      exclude: '.*pb2\w*\.py$'
      pass_filenames: false
